[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "two-stage-3d"
version = "0.1.0"
description = "Reviewable library-first 3D asset and Blender workflow"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7", "jsonschema>=4.18,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
two-stage-3d = "runtime.cli:main"

[tool.setuptools]
packages = ["runtime", "providers", "contracts", "policies", "templates"]

[tool.setuptools.package-data]
contracts = ["*.json"]
policies = ["*.yaml"]
templates = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
